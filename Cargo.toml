[package]
name = "altered_history"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
redb = "2.1.3"
pickledb = "0.5.1"
rocksdb = {git = "https://github.com/rust-rocksdb/rust-rocksdb.git"}
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"

log = "0.4.17"
stderrlog = "0.6.0"
anyhow = {version="1.0.79", features=["backtrace"]}

swh-graph = "11.1.0"
once_cell = "1.19.0"
regex = "1.10.4"
indicatif = "0.17.8"
chashmap = "2.2.2"
rayon = "1.10.0"
argmin = "0.10.0"
clap = "4.5.4"
num_cpus = "1.16.0"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio"] }
tokio = { version = "1", features = ["full"] }
dotenv = "0.15.0"
csv = "1.3.0"

orc-rust = "0.5.0"

ar_row = "1.0.0"
ar_row_derive = "1.0.0"

libc = "0.2.155"
simplelog = "0.12.2"
flexi_logger = "0.29.4"
sha1_smol = "1.0.1"

arrow-array = "53.2.0"
arrow-schema = "53.2.0"
arrow-buffer = "53.2.0"

rand = "0.9.0"
counter = "0.6.0"

[profile.release]
debug=2
